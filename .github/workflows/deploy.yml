name: Build and Deploy

# This workflow builds the election website and deploys it to GitHub Pages.
# It runs whenever changes are pushed to the default branch (usually
# ``main``) so that the maps and data remain up to date.  The
# workflow installs Python dependencies, scrapes the latest vote
# data, generates new maps, then uploads the ``site`` directory as a
# GitHub Pages artifact.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build seat results from official EC data
        run: |
          mkdir -p results
          python scripts/build_ec_seat_results.py \
            --config config/coalitions.json \
            --output results/seat_results.csv

      - name: Build site data JSON
        run: |
          mkdir -p site/data
          python scripts/build_site_data.py

      - name: Copy website files
        run: |
          cp -r site_src/* site/
          cp data/constituencies.geojson site/data/constituencies.geojson

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
